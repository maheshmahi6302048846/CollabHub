name: Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Install git-ftp
        run: sudo apt-get update && sudo apt-get install -y git-ftp

      - name: 🚀 Sync Code to InfinityFree
        run: |
          git config git-ftp.url "ftp://${{ secrets.FTP_SERVER }}/htdocs/"
          git config git-ftp.user "${{ secrets.FTP_USERNAME }}"
          git config git-ftp.password "${{ secrets.FTP_PASSWORD }}"
          git ftp push --force --passive
