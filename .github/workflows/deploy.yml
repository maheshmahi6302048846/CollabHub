name: Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Install git-ftp
        run: sudo apt-get update && sudo apt-get install -y git-ftp

      - name: 🚀 Sync Code to InfinityFree
        run: |
          git ftp push --force --user "${{ secrets.FTP_USERNAME }}" --passwd "${{ secrets.FTP_PASSWORD }}" --syncroot . ftp://${{ secrets.FTP_SERVER }}/htdocs/
